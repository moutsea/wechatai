name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:local
      - run: pnpm check:public
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm test:browser
      - run: pnpm test:openclaw
      - run: pnpm test:receiver
      - run: pnpm test:executor
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: pnpm test:receiver-watchdog
      - name: Verify receiver release modes under a restrictive umask
        run: |
          umask 077
          pnpm build:receiver
          mkdir "$RUNNER_TEMP/receiver-release"
          (umask 022 && tar -xzf backend/dist/linux-amd64/wechatai-receiver-*.tar.gz -C "$RUNNER_TEMP/receiver-release")
          cd "$RUNNER_TEMP/receiver-release"
          test "$(stat -c %a receiver-watchdog)" = 755
          for file in *.mjs *.json *.service; do test "$(stat -c %a "$file")" = 644; done
      - run: pnpm test:backend-executor
      - run: pnpm test:cutover
      - run: pnpm test:monitor
      - run: node --test scripts/backend-artifact.node-test.mjs

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan Git history with Gitleaks
        run: |
          curl -fsSL --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git --redact --log-opts="--all"

  backend:
    name: Go backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.4"
          cache-dependency-path: backend/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build Linux backend and receiver package
        run: |
          node ../scripts/build-backend.mjs
          node ../scripts/package-receiver.mjs
      - name: Validate release control flow (simulated systemd)
        working-directory: .
        run: python3 -m unittest discover -s backend/deploy -p 'test_*.py'

  deploy-backend:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, secrets, backend]
    uses: ./.github/workflows/deploy-backend.yml

  deploy-edge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, secrets, backend]
    uses: ./.github/workflows/deploy-edge.yml
