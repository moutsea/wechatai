name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    if: github.event_name == 'pull_request' || github.repository != 'moutsea/wechatai'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:local
      - run: pnpm check:public
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm test:browser
      - run: pnpm test:openclaw
      - run: pnpm test:receiver
      - run: pnpm test:executor
      - run: pnpm test:monitor

  secrets:
    if: github.event_name == 'pull_request' || github.repository != 'moutsea/wechatai'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan Git history with Gitleaks
        run: |
          curl -fsSL --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git --redact --log-opts="--all"

  sg-main:
    name: Trusted main checks on SG
    if: github.repository == 'moutsea/wechatai' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # Only trusted main receives this key. It can write solely to the private
      # CI controller; no SG runner is registered to this public repository.
      - name: Check out private CI controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: moutsea/wechatai-ci
          ref: main
          ssh-key: ${{ secrets.SG_CI_BRIDGE_KEY }}

      - name: Queue this main commit
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, re
          sha = os.environ['SOURCE_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}', sha)
          with open('source.json', 'w') as target:
              json.dump({'repository': 'moutsea/wechatai', 'sha': sha}, target, indent=2)
              target.write('\n')
          PY
          git config user.name 'WeChatAI CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source.json
          if git diff --cached --quiet; then
            echo 'This commit was already queued.'
          else
            git commit -m "ci: check WeChatAI ${SOURCE_SHA}"
            git push origin HEAD:main
          fi
          printf 'CONTROLLER_SHA=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Wait for the actual SG test result
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          for attempt in {1..340}; do
            git fetch --quiet --depth=1 origin results
            if git show "FETCH_HEAD:results/$SOURCE_SHA.json" > "$RUNNER_TEMP/sg-result.json" 2>/dev/null; then
              result=$(python3 - <<'PY'
          import json, os
          with open(os.environ['RUNNER_TEMP']+'/sg-result.json') as source:
              result = json.load(source)
          if result.get('source_sha') == os.environ['SOURCE_SHA'] and result.get('controller_sha') == os.environ['CONTROLLER_SHA']:
              print(result['conclusion'])
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('SG result: '+result['conclusion']+' — '+result['run_url']+'\n')
          PY
              )
              case "$result" in
                success) exit 0 ;;
                failure|cancelled) echo "SG checks $result"; exit 1 ;;
              esac
            fi
            sleep 15
          done
          echo 'Timed out waiting for SG checks; inspect moutsea/wechatai-ci Actions.' >&2
          exit 1
