name: Deploy Cloudflare edge
on:
  workflow_call:
    secrets:
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      WRANGLER_CONFIG:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: true
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-edge-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: edge-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:local
        if: github.event_name == 'workflow_dispatch'
      - run: pnpm check:public
        if: github.event_name == 'workflow_dispatch'
      - run: pnpm check
        if: github.event_name == 'workflow_dispatch'
      - name: Prepare private production configuration
        env:
          EDGE_WRANGLER_CONFIG: ${{ secrets.WRANGLER_CONFIG }}
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync, appendFileSync } from 'node:fs';
          const value=process.env.EDGE_WRANGLER_CONFIG;
          if (!value?.trim()) throw new Error('Set edge-production WRANGLER_CONFIG');
          const path='wrangler.actions.local.jsonc';
          writeFileSync(path,value,{mode:0o600});
          appendFileSync(process.env.GITHUB_ENV,`WECHATAI_WRANGLER_CONFIG=${path}\n`);
          JS
      - name: Build production edge bundle
        run: pnpm build:edge >/dev/null 2>&1
        env:
          WRANGLER_LOG: warn
      - id: release-head
        uses: ./.github/actions/release-head
      - name: Publish Cloudflare Worker
        if: steps.release-head.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG: warn
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Set the edge-production CLOUDFLARE_API_TOKEN secret}"
          pnpm run publish:edge --tag "${GITHUB_SHA:0:12}" >/dev/null 2>&1
